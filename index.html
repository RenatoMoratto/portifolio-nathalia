<!doctype html>
<!-- `lang` is a sensible default; DocumentLanguage keeps it in sync at runtime. -->
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Fonts load here rather than via `@import` in index.css: an @import inside a
      stylesheet is discovered only after that stylesheet is parsed, which
      serializes the request behind the CSS. preconnect + link starts it during
      HTML parse instead.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    />
    <meta
      name="description"
      content="Nathália Moratto Caldeira - Product Designer specializing in  UX researcher, UX designer, QA. 2+ years building high-performance, scalable user interfaces."
    />
    <meta
      name="keywords"
      content="Product Designer, UX researcher, UX designer, QA, Brazil"
    />
    <meta name="author" content="Nathália Moratto Caldeira" />
    <meta property="og:title" content="Nathália Moratto Caldeira - Product Designer" />
    <meta
      property="og:description"
      content="Product Designer specializing in UX researcher, UX designer, QA. Building high-performance, scalable UIs."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nathália Moratto Caldeira - Product Designer" />
    <meta
      name="twitter:description"
      content="Product Designer specializing in UX researcher, UX designer, QA."
    />
    <title>Nathália Moratto Caldeira | Product Designer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
