<!doctype html>
<!-- DocumentLanguage updates this default at runtime. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#df5068" />

    <!-- Avoid delaying font discovery until CSS is parsed. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    />

    <meta
      name="description"
      content="Nathália Moratto Caldeira - Product Designer specializing in UX research, UX design and QA. 2+ years building high-performance, scalable user interfaces."
    />
    <meta
      name="keywords"
      content="Product Designer, UX researcher, UX designer, QA, Brazil"
    />
    <meta name="author" content="Nathália Moratto Caldeira" />

    <meta property="og:title" content="Nathália Moratto Caldeira - Product Designer" />
    <meta
      property="og:description"
      content="Product Designer specializing in UX research, UX design and QA. Building high-performance, scalable UIs."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nathália Moratto Caldeira" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />
    <!-- TODO: Use an absolute social image URL once the production domain is known. -->
    <meta property="og:image" content="%BASE_URL%og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Portrait of Nathália Moratto Caldeira, Product Designer"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nathália Moratto Caldeira - Product Designer" />
    <meta
      name="twitter:description"
      content="Product Designer specializing in UX research, UX design and QA."
    />
    <meta name="twitter:image" content="%BASE_URL%og-image.jpg" />

    <title>Nathália Moratto Caldeira | Product Designer</title>

    <!-- Set the theme before React mounts to avoid a flash. Keep in sync with ThemeProvider. -->
    <script>
      (function () {
        var stored;
        try {
          stored = localStorage.getItem('theme-preference');
        } catch (e) {
          // Use the device preference when storage is unavailable.
        }
        var light =
          stored === 'light' ||
          (stored !== 'dark' &&
            !!window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.classList.toggle('dark', !light);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
