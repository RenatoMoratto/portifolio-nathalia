<!doctype html>
<!-- `lang` is a sensible default; DocumentLanguage keeps it in sync at runtime. -->
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#df5068" />

    <!--
      Fonts load here rather than via `@import` in index.css: an @import inside a
      stylesheet is discovered only after that stylesheet is parsed, which
      serializes the request behind the CSS. preconnect + link starts it during
      HTML parse instead.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    />

    <meta
      name="description"
      content="Nathália Moratto Caldeira - Product Designer specializing in UX research, UX design and QA. 2+ years building high-performance, scalable user interfaces."
    />
    <meta
      name="keywords"
      content="Product Designer, UX researcher, UX designer, QA, Brazil"
    />
    <meta name="author" content="Nathália Moratto Caldeira" />

    <meta property="og:title" content="Nathália Moratto Caldeira - Product Designer" />
    <meta
      property="og:description"
      content="Product Designer specializing in UX research, UX design and QA. Building high-performance, scalable UIs."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nathália Moratto Caldeira" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />
    <!--
      `%BASE_URL%` is Vite's base path, so the image still resolves when the site
      is served from a subdirectory. Vite rewrites asset attributes such as
      `link[href]` on its own, but not `meta[content]`.

      TODO: og:image should be an absolute URL (https://your-domain/og-image.jpg).
      Several crawlers, LinkedIn included, will not resolve a relative path.
    -->
    <meta property="og:image" content="%BASE_URL%og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Portrait of Nathália Moratto Caldeira, Product Designer"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nathália Moratto Caldeira - Product Designer" />
    <meta
      name="twitter:description"
      content="Product Designer specializing in UX research, UX design and QA."
    />
    <meta name="twitter:image" content="%BASE_URL%og-image.jpg" />

    <title>Nathália Moratto Caldeira | Product Designer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
