name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Scoped per job rather than here: only the deploy job needs to write.
permissions: {}

# One deployment at a time. Runs queued behind the one in flight are superseded
# by the newest commit, but the in-flight run is left to finish - cancelling it
# mid-upload would publish a partial site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the site's URL
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          # The path GitHub itself serves the site from - `/portifolio-nathalia`
          # today, `/` once a custom domain is configured in the Pages settings.
          # Taking it from the API rather than hardcoding it means neither a repo
          # rename nor a custom domain needs a change here.
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path || format('/{0}/', github.event.repository.name) }}
          # No fallback values: the build deliberately fails when these are
          # missing, which is better than publishing a dead contact form.
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write # deploy-pages authenticates with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
